  <div data-hf-id="hf-ovma" id="root" data-composition-id="01-who-controls" data-width="1920" data-height="1080">
    <div data-hf-id="hf-ram1" id="f01-who-controls-ground" class="clip f01-who-controls-ground" data-start="0" data-duration="5" data-track-index="0"></div>

    <div data-hf-id="hf-yjfn" id="f01-who-controls-lockup" class="clip" data-start="0" data-duration="4.4" data-track-index="1">
      <div data-hf-id="hf-0q4m" id="f01-who-controls-stack" class="f01-who-controls-stack">
        <div data-hf-id="hf-5urm" class="f01-who-controls-line f01-who-controls-line-a">
          <span data-hf-id="hf-raez" id="f01-who-controls-text-a" class="f01-who-controls-text"></span><span data-hf-id="hf-2j1a" id="f01-who-controls-caret-a" class="f01-who-controls-caret f01-who-controls-caret-a"></span>
        </div>
        <div data-hf-id="hf-1wnl" class="f01-who-controls-line f01-who-controls-line-b">
          <span data-hf-studio-original-inline-translate="" style="translate: -259.82px 8.965px" data-hf-id="hf-gexc" id="f01-who-controls-text-b" class="f01-who-controls-text">But who controls what they’re allowed to </span><span data-hf-id="hf-12r2" id="f01-who-controls-caret-b" class="f01-who-controls-caret f01-who-controls-caret-b"></span>
        </div>

    <div data-hf-id="hf-r7xr" id="f01-who-controls-desk" class="clip" data-start="4.4" data-duration="0.6" data-track-index="2">

        <img data-hf-id="hf-byjs" id="f01-who-controls-desk-img" class="f01-who-controls-desk-img" src="assets/scroll-000.png" alt="">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const DURATION = 5;
      const LINE_A = "AI agents can act.";
      const LINE_B = "But who controls what they’re allowed to do?";
      const TYPING_GRACE = 0.18;
      const BLINK_CYCLES = 6;
      const T_LINE_B = 2.2;

      function typeStates(text, t0, baseGap) {
        const states = [{ t: t0, text: "" }];
        let t = t0;
        for (let i = 0; i < text.length; i += 1) {
          const ch = text[i];
          let gap = baseGap;
          if (ch === " ") gap += 0.05;
          if (ch === "." || ch === "?") gap += 0.08;
          t += gap;
          states.push({ t, text: text.slice(0, i + 1) });
        }
        return states;
      }

      const SEQ_A = typeStates(LINE_A, 0.2, 0.074);
      const SEQ_B = typeStates(LINE_B, 2.48, 0.03);

      function textAt(seq, time) {
        for (let i = seq.length - 1; i >= 0; i -= 1) {
          if (time >= seq[i].t) return seq[i].text;
        }
        return "";
      }

      const CHANGE_TIMES = []
        .concat(
          SEQ_A.filter((e, i) => i > 0 && e.text !== SEQ_A[i - 1].text).map((e) => e.t),
        )
        .concat(
          SEQ_B.filter((e, i) => i > 0 && e.text !== SEQ_B[i - 1].text).map((e) => e.t),
        );

      const textA = document.getElementById("f01-who-controls-text-a");
      const textB = document.getElementById("f01-who-controls-text-b");
      const caretA = document.getElementById("f01-who-controls-caret-a");
      const caretB = document.getElementById("f01-who-controls-caret-b");
      const stack = document.getElementById("f01-who-controls-stack");
      const deskInner = document.getElementById("f01-who-controls-desk-inner");

      const driver = { t: 0 };
      const blink = { p: 0 };

      function paint(time) {
        textA.textContent = textAt(SEQ_A, time);
        textB.textContent = time >= T_LINE_B ? textAt(SEQ_B, time) : "";

        const isTyping = CHANGE_TIMES.some(
          (t) => t <= time && time - t < TYPING_GRACE,
        );
        const seated = time < 0.2;
        const blinkOn = Math.sin(blink.p) > 0 ? 1 : 0;
        const caretOp = seated || isTyping ? 1 : blinkOn;
        const onB = time >= T_LINE_B && time < 4.4;
        caretA.style.opacity = onB ? "0" : String(caretOp);
        caretB.style.opacity = onB ? String(caretOp) : "0";
      }

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        caretA,
        { y: 14 },
        { y: 0, duration: 0.18, ease: "power2.out" },
        0,
      );

      tl.fromTo(
        stack,
        { scale: 1 },
        { scale: 0.92, duration: 0.28, ease: "power2.inOut", transformOrigin: "50% 0%" },
        T_LINE_B,
      );

      tl.fromTo(
        deskInner,
        { scale: 1.045 },
        { scale: 1, duration: 0.16, ease: "power2.out", transformOrigin: "50% 50%" },
        4.4,
      );

      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            paint(driver.t);
          },
        },
        0,
      );

      tl.to(
        blink,
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            paint(driver.t);
          },
        },
        0,
      );

      paint(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-who-controls"] = tl;
    })();
  </script>
